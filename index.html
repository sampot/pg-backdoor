<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <title>後門任務</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game">
      <canvas id="stage" aria-label="資料堡壘滲透地圖"></canvas>

      <div id="hud" hidden>
        <div class="hud-top">
          <div class="hud-mission">
            <span>同一關 · 多解</span>
            <strong id="hud-approach">通風管潛入</strong>
          </div>
          <div class="hud-meters">
            <div class="meter" role="img" aria-label="警報">
              <span class="meter-name">警報</span>
              <div class="meter-track"><div class="meter-fill alarm" id="alarm-fill"></div></div>
              <span id="alarm-value">0%</span>
            </div>
            <div class="meter" role="img" aria-label="路線資源">
              <span class="meter-name" id="meter-label">暴露</span>
              <div class="meter-track"><div class="meter-fill route" id="meter-fill"></div></div>
              <span id="meter-value">0%</span>
            </div>
            <div class="hud-clock"><span id="hud-time">0:00</span></div>
          </div>
          <button type="button" id="pause-btn" class="icon-btn" aria-label="暫停">❚❚</button>
        </div>
        <p id="hud-hint" class="hud-hint" aria-live="polite"></p>
      </div>

      <div id="touch-layer" hidden>
        <div id="stick-zone" class="stick-zone">
          <div id="stick-base" class="stick-base" hidden>
            <div id="stick-knob" class="stick-knob"></div>
          </div>
          <span class="stick-hint">拖曳移動</span>
        </div>
        <div class="action-cluster">
          <button type="button" id="crouch-btn" class="round-btn crouch" aria-pressed="false">蹲伏</button>
          <button type="button" id="act-btn" class="round-btn act" disabled>互動</button>
        </div>
      </div>

      <section id="panel" class="panel open" aria-live="polite">
        <div class="panel-inner" id="panel-inner"></div>
      </section>

      <p id="toast" class="toast" role="status" hidden></p>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
